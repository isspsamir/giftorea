<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Récapitulatif — Giftorea</title>
  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/orderconfirmation.css">
</head>
<body>
  <!-- Background -->
  <div class="site-bgmesh" aria-hidden="true">
    <div class="mesh m-a"></div>
    <div class="mesh m-b"></div>
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="rays"></div>
  </div>

  <main class="gft-wrap">
    <section class="gft-order glass" role="region" aria-label="Récapitulatif de commande">
      <!-- Top / Hero -->
      <header class="gft-hero">
        <div class="gft-step">
          <span class="gft-step__dot" aria-hidden="true"></span>
          <span class="gft-step__txt">Étape 2 sur 4 — Vérification</span>
        </div>
        <h1 class="gft-hero__title">Vérifiez votre sélection avant validation</h1>
        <p class="gft-hero__note">
          Assurez-vous que <strong>les articles</strong> et <strong>les quantités</strong> sont corrects.
          La <strong>personnalisation</strong> et la <strong>livraison</strong> seront précisées à l’étape suivante.
        </p>
      </header>

      <!-- Sheet -->
      <div class="gft-sheet">
        <div class="gft-table__head">
          <span class="col produit">Produit</span>
          <span class="col qtt">Qté</span>
          <span class="col total">Total</span>
        </div>

        <div id="orderItems" class="gft-table__body" role="list"></div>

        <footer class="gft-totalbar">
          <span class="gft-totalbar__label">Total global</span>
          <span id="globalTotal" class="gft-totalbar__right">0 DZD</span>
        </footer>
      </div>

      <!-- Actions -->
      <div class="gft-actions">
        <button id="backBtn" class="btn btn--secondary" type="button" aria-label="Retour à la sélection">
          <span class="btn__inner">
            <svg class="btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M10 19l-7-7l7-7M3 12h18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="btn__label">Retour à la sélection</span>
          </span>
        </button>

        <!-- Change this URL if your next step lives elsewhere -->
        <a id="confirmBtn"
           class="btn btn--primary"
           href="../personalisation/personalisation.html"
           aria-label="Valider et continuer">
          <span class="btn__inner">
            <svg class="btn__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12l4 4l10-10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="btn__label">Valider et continuer</span>
          </span>
        </a>
      </div>
    </section>
  </main>

  <!-- JS -->
  <script defer src="../assets/js/orderconfirmation.js"></script>
  <noscript>Activez JavaScript pour voir le récapitulatif de commande.</noscript>
</body>
</html>
